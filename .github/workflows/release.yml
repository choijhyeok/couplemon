name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: |
          swift build -Xswiftc -warnings-as-errors
          swift test
      - name: Build installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          COUPLEMON_VERSION="$version" COUPLEMON_BUILD="$GITHUB_RUN_NUMBER" ./Scripts/package-installer.sh
          test "$(plutil -extract CFBundleShortVersionString raw dist/CoupleMon.app/Contents/Info.plist)" = "$version"
          codesign --verify --deep --strict --verbose=2 dist/CoupleMon.app
          relocated=$(mktemp -d)
          build_resources="$(swift build -c release --show-bin-path)/CoupleMon_CoupleMon.bundle"
          trap 'if [ -d "$relocated/build-resources" ]; then mv "$relocated/build-resources" "$build_resources"; fi; rm -rf "$relocated"' EXIT
          cp -RX dist/CoupleMon.app "$relocated/CoupleMon.app"
          mv "$build_resources" "$relocated/build-resources"
          "$relocated/CoupleMon.app/Contents/MacOS/CoupleMon" --check-resources
          for resource in viewer.html viewer.js couple-scene.js motion-player.js generation-prompt.txt build-model.py pet-actions.py vendor/three.module.min.js vendor/three.core.min.js vendor/GLTFLoader.js vendor/LICENSE; do
            test -s "dist/CoupleMon.app/Contents/Resources/CoupleMon_CoupleMon.bundle/Pet3D/$resource"
          done
          pkgutil --payload-files dist/CoupleMon.pkg | grep -q '^\./CoupleMon.app/Contents/MacOS/CoupleMon$'
          pkgutil --payload-files dist/CoupleMon.pkg | grep -q '^\./CoupleMon.app/Contents/Resources/AppIcon.icns$'
          pkgutil --payload-files dist/CoupleMon.pkg | grep -q '^\./CoupleMon.app/Contents/Resources/DefaultPet/pet.json$'
          pkgutil --payload-files dist/CoupleMon.pkg | grep -q '^\./CoupleMon.app/Contents/Resources/CoupleMon_CoupleMon.bundle/quokka.png$'
          pkgutil --payload-files dist/CoupleMon.pkg | grep -q '^\./CoupleMon.app/Contents/Resources/CoupleMon_CoupleMon.bundle/couple_bed.png$'
          # AppleDouble entries (._*) describe metadata, not additional images.
          test "$(pkgutil --payload-files dist/CoupleMon.pkg | grep -c '^\./CoupleMon.app/Contents/Resources/CoupleMon_CoupleMon.bundle/[^.][^/]*\.png$')" = 21
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/CoupleMon.pkg --verify-tag --generate-notes --title "CoupleMon ${GITHUB_REF_NAME#v}"
